<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RecRev</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/private/assets/img/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f0d1a;--mute:#5d5975;--paper:#FBFAFE;--grad:linear-gradient(90deg,#ED89E2 0%,#C488E8 50%,#5E8DF3 100%)}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif;display:grid;place-items:center;padding:24px}
main{max-width:520px;text-align:center}img{width:150px;height:auto;margin:0 auto 28px;display:block}
h1{font:800 clamp(30px,6vw,44px)/1.05 Manrope,Inter,sans-serif;letter-spacing:-.04em;margin:0 0 12px}
h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0 0 22px;color:var(--mute)}a{color:#5E8DF3;text-decoration:none;font-weight:500}
.bar{height:3px;width:120px;margin:0 auto 28px;border-radius:3px;background:var(--grad)}
</style></head><body><main>
<img src="/assets/logos/logo-gradient.svg" alt="RecRev">
<div class="bar"></div>
<h1>Something <span>new</span> is on the way.</h1>
<p>Recruitment Revenue is becoming RecRev. The new site launches shortly.<br>Until then, reach us at <a href="mailto:hello@recrev.com">hello@recrev.com</a>.</p>
</main></body></html>
